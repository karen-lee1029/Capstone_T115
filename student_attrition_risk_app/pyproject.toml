[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-attrition-risk-app"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
	"fastapi>=0.115,<1",
	"uvicorn[standard]>=0.30,<1",
	"streamlit>=1.40,<2",
	"fastmcp>=2.0,<3",
	"databricks-sdk>=0.50,<1",
	"databricks-sql-connector>=3.0,<4",
	"pydantic>=2.8,<3",
	"httpx>=0.27,<1",
	"websockets>=13,<17",
]

[dependency-groups]
dev = [
	"pytest>=8,<9",
	"pytest-asyncio>=0.24,<1",
	"ruff>=0.8,<1",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
